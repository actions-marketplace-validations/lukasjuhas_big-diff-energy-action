name: 'Big Diff Energy'
description: 'Comments on PRs with large diffs (1000+ additions) with stats and a humorous message'
author: 'Lukas Juhas'
branding:
  icon: 'alert-circle'
  color: 'orange'

inputs:
  github-token:
    description: 'GitHub token for posting comments'
    required: true
  threshold:
    description: 'Minimum number of additions to trigger the comment'
    required: false
    default: '1000'
  title:
    description: 'Custom title for the comment'
    required: false
    default: 'This PR has some **big diff energy**:'
  message:
    description: 'Custom message to display below the stats'
    required: false
    default: "That's a lot of changes! Consider breaking this into smaller PRs for easier review."
  image-url:
    description: 'Custom image URL for the comment'
    required: false
    default: 'https://raw.githubusercontent.com/lukasjuhas/big-diff-energy-action/main/assets/matthew-smoking.jpeg'

runs:
  using: 'node20'
  main: 'index.js'

